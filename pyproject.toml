[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "quantumai"
version = "0.1.0"
description = "Audit Python repositories with AST analysis + OpenAI, and auto-generate professional READMEs."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Your Name", email = "you@example.com" }]
keywords = ["security", "static-analysis", "ast", "openai", "readme", "audit"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "openai>=1.30.0",
    "click>=8.1",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
quantumai = "quantumai.cli:main"

[project.urls]
Homepage = "https://github.com/your-username/quantumai"
Issues = "https://github.com/your-username/quantumai/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/quantumai"]

[tool.ruff]
line-length = 100
target-version = "py39"
